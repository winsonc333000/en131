const GLOBAL_CSS = `
@import url('https://fonts.googleapis.com/css2?family=Lexend+Mega:wght@400;600;700;800&family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Space+Mono:wght@400;700&display=swap');

:root {
  --nb-bg: #fffdf5;
  --nb-text: #1a1a1a;
  --nb-border: #1a1a1a;
  --nb-shadow: #1a1a1a;
  --nb-yellow: #FFE500;
  --nb-orange: #FF6B35;
  --nb-blue: #4A90D9;
  --nb-green: #44CF6C;
  --nb-pink: #FF78C4;
  --nb-lavender: #C4B5FD;
  --nb-red: #EF4444;
  --nb-cyan: #22D3EE;
  --nb-cream: #FFF8E7;
  --heading: 'Lexend Mega', sans-serif;
  --body: 'Public Sans', sans-serif;
  --mono: 'Space Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--nb-bg);
  color: var(--nb-text);
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
}

::selection {
  background: var(--nb-yellow);
  color: var(--nb-text);
}

.nb-card-custom {
  background: white;
  border: 3px solid var(--nb-border);
  box-shadow: 6px 6px 0 var(--nb-shadow);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.nb-card-custom:hover {
  transform: translate(-2px, -2px);
  box-shadow: 8px 8px 0 var(--nb-shadow);
}

.nb-badge {
  display: inline-block;
  border: 2px solid var(--nb-border);
  box-shadow: 3px 3px 0 var(--nb-shadow);
  padding: 4px 12px;
  font-family: var(--mono);
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.nb-divider {
  border: none;
  border-top: 3px solid var(--nb-border);
  margin: 32px 0;
}

@keyframes marquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(8px); }
}

@media (max-width: 700px) {
  .desktop-nav-links { display: none !important; }
  .mobile-toggle { display: block !important; }
}
@media (min-width: 701px) {
  .mobile-nav-dropdown { display: none !important; }
}
`;

  { id: "essay1", label: "01" },

/* ─── Marquee banner ─── */
function MarqueeBanner({ text, color = "var(--nb-yellow)" }) {
  const items = Array(8).fill(text);
  return (
    <div style={{
      background: color, borderTop: "3px solid var(--nb-border)",
      borderBottom: "3px solid var(--nb-border)", overflow: "hidden",
      padding: "10px 0", whiteSpace: "nowrap",
    }}>
      <div style={{
        display: "inline-flex", gap: 48,
        animation: "marquee 20s linear infinite",
      }}>
        {items.map((t, i) => (
          <span key={i} style={{
            fontFamily: "var(--heading)", fontSize: "0.75rem", fontWeight: 800,
            textTransform: "uppercase", letterSpacing: "0.15em",
          }}>
            {t} ★
          </span>
        ))}
        {items.map((t, i) => (
          <span key={`dup-${i}`} style={{
            fontFamily: "var(--heading)", fontSize: "0.75rem", fontWeight: 800,
            textTransform: "uppercase", letterSpacing: "0.15em",
          }}>
            {t} ★
          </span>
        ))}
      </div>
    </div>
  );
}

/* ─── Nav ─── */
function Nav({ active, onNavigate }) {
  const [mobileOpen, setMobileOpen] = useState(false);

  return (
    <nav style={{
      position: "fixed", top: 0, left: 0, right: 0, zIndex: 100,
      background: "var(--nb-bg)", borderBottom: "3px solid var(--nb-border)",
      padding: "0 clamp(16px, 3vw, 40px)",
    }}>
      <div style={{
        maxWidth: 1100, margin: "0 auto",
        display: "flex", alignItems: "center", justifyContent: "space-between",
        height: 60,
      }}>
        <div
          onClick={() => onNavigate("home")}
          style={{
            fontFamily: "var(--heading)", fontSize: "1rem", fontWeight: 800,
            cursor: "pointer", background: "var(--nb-yellow)",
            padding: "6px 14px", border: "3px solid var(--nb-border)",
            boxShadow: "3px 3px 0 var(--nb-shadow)",
          }}
        >
          W.CHEN
        </div>

        <div className="desktop-nav-links" style={{ display: "flex", gap: 6, alignItems: "center" }}>
          {SECTIONS.filter(s => s.id !== "home").map((s, i) => (
            <button
              key={s.id}
              onClick={() => onNavigate(s.id)}
              style={{
                background: active === s.id ? COLORS[i] : "transparent",
                border: active === s.id ? "2px solid var(--nb-border)" : "2px solid transparent",
                boxShadow: active === s.id ? "2px 2px 0 var(--nb-shadow)" : "none",
                padding: "6px 12px", cursor: "pointer",
                fontFamily: "var(--mono)", fontSize: "0.65rem", fontWeight: 700,
                textTransform: "uppercase", letterSpacing: "0.08em",
                transition: "all 0.15s",
              }}
            >
              {s.label}
            </button>
          ))}
        </div>

        <button
          className="mobile-toggle"
          onClick={() => setMobileOpen(!mobileOpen)}
          style={{
            display: "none", background: "var(--nb-yellow)",
            border: "3px solid var(--nb-border)", padding: "6px 12px",
            fontFamily: "var(--heading)", fontSize: "1rem", fontWeight: 800,
            cursor: "pointer", boxShadow: "3px 3px 0 var(--nb-shadow)",
          }}
        >
          {mobileOpen ? "✕" : "☰"}
        </button>
      </div>

      {mobileOpen && (
        <div className="mobile-nav-dropdown" style={{
          borderTop: "3px solid var(--nb-border)", padding: "12px 0 20px",
          display: "flex", flexDirection: "column", gap: 8,
        }}>
          {SECTIONS.filter(s => s.id !== "home").map((s, i) => (
            <button
              key={s.id}
              onClick={() => { onNavigate(s.id); setMobileOpen(false); }}
              style={{
                background: COLORS[i], border: "2px solid var(--nb-border)",
                boxShadow: "3px 3px 0 var(--nb-shadow)",
                padding: "8px 14px", cursor: "pointer",
                fontFamily: "var(--mono)", fontSize: "0.7rem", fontWeight: 700,
                textTransform: "uppercase", textAlign: "left",
              }}
            >
              {s.label}
            </button>
          ))}
        </div>
      )}
    </nav>
  );
}

/* ─── FadeIn ─── */
function FadeIn({ children, delay = 0, style = {} }) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setVis(true); obs.disconnect(); } },
      { threshold: 0.1 }
    );
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref} style={{
      opacity: vis ? 1 : 0,
      transform: vis ? "translateY(0)" : "translateY(24px)",
      transition: `opacity 0.5s ease ${delay}s, transform 0.5s ease ${delay}s`,
      ...style,
    }}>
      {children}
    </div>
  );
}

function ImagePlaceholder({ label, caption, color = "var(--nb-lavender)", float: floatDir, width }) {
  const floatStyle = floatDir === "right"
    ? { float: "right", marginLeft: 24, marginBottom: 12, width: width || "clamp(160px, 35%, 240px)" }
    : floatDir === "left"
    ? { float: "left", marginRight: 24, marginBottom: 12, width: width || "clamp(160px, 38%, 260px)" }
    : { marginBottom: 20, width: "100%" };
  return (
    <div className="nb-card-custom" style={{ padding: 0, overflow: "hidden", ...floatStyle }}>
      <div style={{
        background: "#f5f5f0", border: "3px dashed #ccc",
        minHeight: floatDir ? 180 : 260,
        display: "flex", flexDirection: "column",
        alignItems: "center", justifyContent: "center",
        gap: 10, padding: 20, textAlign: "center",
      }}>
        <div style={{
          width: 44, height: 44, border: "3px solid var(--nb-border)",
          display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: "1.3rem", background: "white",
        }}>📷</div>
        <p style={{
          fontFamily: "var(--mono)", fontSize: "0.58rem", fontWeight: 700,
          textTransform: "uppercase", letterSpacing: "0.1em", color: "#999",
        }}>INSERT IMAGE HERE</p>
        <p style={{
          fontFamily: "var(--body)", fontSize: "0.72rem", color: "#bbb", maxWidth: 180, lineHeight: 1.4,
        }}>{label}</p>
      </div>
      <div style={{
        padding: "8px 12px", background: color, borderTop: "3px solid var(--nb-border)",
      }}>
        <p style={{
          fontFamily: "var(--mono)", fontSize: "0.55rem", fontWeight: 700,
          textTransform: "uppercase", letterSpacing: "0.06em",
        }}>
          {caption || label}
        </p>
      </div>
    </div>
  );
}
